  game.specialMode = false;
  game.hoveredMoveIdx = null;
  game.legalMoves = calcLegalMoves(col, row, topGroup, false);
  showPieceHint(piece);
  render();
}

// 选层完成（点击拆分扇区），进入选目标阶段
function confirmLayer(layers) {
  game.chosenLayers = layers;
  game.hoverIdx = null;
  game.phase = 'pickTarget';
  // 自爆已在选层阶段直接执行，pickTarget 只需移动走点
  game.legalMoves = calcLegalMoves(game.selected.col, game.selected.row, layers, false);
  const piece = game.board[game.selected.row][game.selected.col];
  if (piece) showPieceHint(piece, `已选择${layers}层行动。`);
  render();
}

// 判断某方是否还有可点走法（用于停局检测）
function hasAnyLegalMove(board, owner) {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = board[r][c];
      if (!p || p.owner !== owner) continue;
      const topGroup = getDefaultMoveLayers(p);
      for (const m of generateMoves(board, c, r)) {
        const { board: nb, kingCaptured: kc } = applyMove(board, c, r, { srcCol: c, srcRow: r, ...m, layers: topGroup });
        if (wouldLeaveOwnerUnsafe(nb, owner, kc)) continue;
        return true;
      }
    }
  }
  return false;
}

function removeKingFromBoard(owner) {
  const king = findKing(game.board, owner);
  if (!king) return false;
  game.board[king.row][king.col] = null;
  if (!game.captured.some(c => c.owner === owner && c.type === TYPE.KING)) {
    game.captured.push({ owner, type: TYPE.KING });
  }
  return true;
}

function finishByKingTaken(loser, reason) {
  const winner = enemy(loser);
  removeKingFromBoard(loser);
  game.gameOver = true;
  game.isDraw = false;
  game.winner = winner;
  const loserName = loser === RED ? '红' : '黑';
  const winnerName = winner === RED ? '红' : '黑';
  game.endMessage = `🎉 对局结束：${winnerName}方吃掉${loserName}方王，已经获胜。`;
  addLog(`【${reason}，${loserName}方王被吃掉，${winnerName}方获胜】`, true);
}

async function executeMove(move) {
  // 中断 Pondering（人走棋时 AI 可能还在后台思考）
  if (aiState.ponderTimer) { clearTimeout(aiState.ponderTimer); aiState.ponderTimer = null; }
  if (typeof AI !== 'undefined') AI.abortPonder();
  aiState.pondering = false;

  game.history.push(createHistorySnapshot());

  anim.playing = true;
  const srcCol = game.selected.col, srcRow = game.selected.row;
  const piece = { ...game.board[srcRow][srcCol] };
  const oldBoard = cloneBoard(game.board); // 动画前快照，用于 diffCaptures
  const topGroup = getDefaultMoveLayers(piece);
  let moveLayers = move.layers !== undefined ? move.layers : topGroup;
  if (piece.type === TYPE.KING) moveLayers = topGroup;
  const isSplit = piece.type !== TYPE.KING && (piece.groups ? piece.groups.length > 1 : moveLayers < piece.layer);
  const isStack = move.kind === 'stack';
  if (move.kind === 'explode' && (_CLASSIC || piece.type !== TYPE.PAWN || piece.upgraded === false)) {
    showPieceHint(piece, '这枚兵还没有觉醒，不能自爆。');
    return;
  }

  // 计算最终棋盘（先算好，动画只负责过渡展示）
  const { board: newBoard, log, kingCaptured } = applyMove(
    game.board, srcCol, srcRow, move
  );

  // 清除选择UI
  game.phase = 'select';
  game.selected = null;
  game.hoverIdx = null;
  game.specialMode = false;
  game.legalMoves = [];
  clearPieceHint();

  try {
    // ── 合体动画（直接闪光）──
    if (move.kind === 'merge') {
      game.board = newBoard; render();
      await animGlow(srcCol, srcRow, '#27ae60', 400);
    }
    // ── 兵自爆动画 ──
    else if (move.kind === 'explode') {
      const waves = computeExplosionWaves(game.board, srcCol, srcRow, piece.layer); // 范围=总层数
      for (const cells of waves) {
        anim.overlays = cells; render();
        await _wait(400);
      }
      anim.overlays = [];
      game.board = newBoard; render();
      await _wait(100);
    }
    // ── 车冲撞动画 ──
    else if (move.kind === 'charge') {
      const stopCol = move.col - move.dc, stopRow = move.row - move.dr;
      const targetPiece = { ...game.board[move.row][move.col] };
      const slidePiece = { ...piece, layer: moveLayers };
      // 车滑动到停止位
      game.board[srcRow][srcCol] = isSplit
        ? (() => {
            const remGs = piece.groups ? piece.groups.slice(1) : null;
            const remL = remGs ? remGs.reduce((s,g)=>s+g,0) : (piece.layer - moveLayers);
            return remL > 0 ? { ...piece, layer: remL, groups: remGs || undefined } : null;
          })()
        : null;
      await animSlide(slidePiece, srcCol, srcRow, stopCol, stopRow, 250);
      game.board[stopRow][stopCol] = slidePiece;
      render();
      // 推送路径红框
      const pushPath = computeChargePushPath(game.board, move.col, move.row, move.dc, move.dr);
      if (pushPath.length) {
        anim.overlays = pushPath; render();
        await _wait(300);
        anim.overlays = [];
      }
      // 被推棋子滑动
      const landCell = pushPath.length > 0 ? pushPath[pushPath.length - 1] : { col: move.col, row: move.row };
      game.board[move.row][move.col] = null;
      await animSlide(targetPiece, move.col, move.row, landCell.col, landCell.row, 200);
      game.board = newBoard; render();
      // 车冲撞推王出九宫检测
      if (targetPiece.type === TYPE.KING) {
        const ko = targetPiece.owner;
        if (inPalace(move.col, move.row, ko)) {
          const nk = findKing(newBoard, ko);
          if (nk && !inPalace(nk.col, nk.row, ko)) {
            await animPalaceGlow(ko, 600);
          }
        }
      }
    }
    // ── 马动画（连踩路径 + 逐跳滑动）──
    else if (piece.type === TYPE.HORSE && move.kind !== 'stack') {
      const path = findHorsePath(game.board, srcCol, srcRow, move.col, move.row);
      if (path.length > 2) {
        await animHorsePath(path);
      }
      const slidePiece = { ...piece, layer: moveLayers };
      game.board[srcRow][srcCol] = isSplit
        ? (() => {
            const remGs = piece.groups ? piece.groups.slice(1) : null;
            const remL = remGs ? remGs.reduce((s,g)=>s+g,0) : (piece.layer - moveLayers);
            return remL > 0 ? { ...piece, layer: remL, groups: remGs || undefined } : null;
          })()
        : null;
      for (let i = 0; i < path.length - 1; i++) {
        await animSlide(slidePiece, path[i].col, path[i].row, path[i+1].col, path[i+1].row, 120);
      }
      anim.pathLines = [];
      game.board = newBoard; render();
    }
    // ── 士/相动画（滑动 + 波范围闪烁）──
    else if (!_CLASSIC && piece.upgraded !== false && (piece.type === TYPE.ADVISOR || piece.type === TYPE.BISHOP) && move.kind !== 'stack') {
      const slidePiece = { ...piece, layer: moveLayers };
      game.board[srcRow][srcCol] = isSplit
        ? (() => {
            const remGs = piece.groups ? piece.groups.slice(1) : null;
            const remL = remGs ? remGs.reduce((s,g)=>s+g,0) : (piece.layer - moveLayers);
            return remL > 0 ? { ...piece, layer: remL, groups: remGs || undefined } : null;
          })()
        : null;
      await animSlide(slidePiece, srcCol, srcRow, move.col, move.row, 250);
      // 落地后显示波范围红框
      const waveZone = piece.type === TYPE.ADVISOR
        ? computeAdvisorWaveZone(move.col, move.row, moveLayers)
        : computeBishopWaveZone(move.col, move.row, moveLayers);
      if (waveZone.length) {
        game.board[move.row][move.col] = slidePiece;
        anim.overlays = waveZone; render();
        await _wait(400);
        anim.overlays = [];
      }
      game.board = newBoard; render();
    }
    // ── 普通移动/吃子/叠层动画 ──
    else {
      const slidePiece = { ...piece, layer: moveLayers };
      game.board[srcRow][srcCol] = isSplit
        ? (() => {
            const remGs = piece.groups ? piece.groups.slice(1) : null;
            const remL = remGs ? remGs.reduce((s,g)=>s+g,0) : (piece.layer - moveLayers);
            return remL > 0 ? { ...piece, layer: remL, groups: remGs || undefined } : null;
          })()
        : null;
      await animSlide(slidePiece, srcCol, srcRow, move.col, move.row, 250);
      game.board = newBoard; render();
    }

    // 叠层升级光环（绿色）/ 拆分降级光环（红色）
    if (isStack) {
      await animGlow(move.col, move.row, '#27ae60', 400);
    } else if (isSplit) {
      await animGlow(srcCol, srcRow, '#e74c3c', 400);
    }

  } finally {
    // 确保动画状态被清理
    anim.playing = false;
    anim.overlays = [];
    anim.slide = null;
    anim.srcHide = null;
    anim.pathLines = [];
    anim.glow = null;
    anim.palaceGlow = null;
  }

  // 追踪损失棋子（用动画前的快照比较，因为动画过程中 game.board 已被修改）
  const newCaps = diffCaptures(oldBoard, newBoard);
  game.captured.push(...newCaps);
  recordRedSurvivalLosses(newCaps, gameStats.totalMoves + (piece.owner === RED ? 1 : 0));

  // ── 关卡统计追踪（红方走棋时） ──
  if (piece.owner === RED) {
    gameStats.totalMoves++;
    _addToSet(gameStats.typesMoved, piece.type);
    const enemyKilled = newCaps.filter(c => c.owner === BLACK);
    if (enemyKilled.length > 0) {
      _addToSet(gameStats.typesCaptured, piece.type); // 记录发起吃子的红方棋型
      gameStats.redKillsByType[piece.type] = (gameStats.redKillsByType[piece.type] || 0) + enemyKilled.length;
      // 历史字段：当前马只在最终落点结算吃子，这里保留累计兼容旧统计结构
      if (piece.type === TYPE.HORSE) {
        gameStats.maxChainKills = Math.max(gameStats.maxChainKills, enemyKilled.length);
      }
      // 兵自爆
      if (move.kind === 'explode') {
        gameStats.pawnExplodeKills += enemyKilled.length;
      }
      // 王击杀叠层（王吃目标格，目标格在 oldBoard 的 layer>1 即为叠层）
      if (piece.type === TYPE.KING) {
        const killedTarget = oldBoard[move.row][move.col];
        if (killedTarget && killedTarget.layer > 1) gameStats.kingKillsStacked++;
      }
    }
    // 王出九宫格
    if (piece.type === TYPE.KING) {
      if (!inPalace(move.col, move.row, RED)) gameStats.kingLeftPalace = true;
    }
    // 車运输叠兵（charge + 被运的是红兵且 layer>1）
    if (move.kind === 'charge') {
      const target = oldBoard[move.row][move.col];
      if (target && target.owner === RED && target.type === TYPE.PAWN && target.layer > 1) {
        gameStats.rookTransportedStackedPawn = true;
      }
    }
    // 叠兵到达底线（row 0 = 黑方底线）
    if (piece.type === TYPE.PAWN && move.row === 0 && piece.layer > 1) {
      gameStats.stackedPawnReachedBottom = true;
    }
  }

  game.board = newBoard;
  game.lastMove = { fromCol: srcCol, fromRow: srcRow, toCol: move.col, toRow: move.row };
  game.hoveredMoveIdx = null;
  addLog(log.join(' | '));
  if (_LEVEL_ID) moveLogSimple.push({ side: piece.owner, text: log.join(' | ') });
  // 仅在黑方走完后（完整一回合结束）推入折线图数据点，避免吃子后被立即反吃导致曲线剧烈抖动
  // enemy(game.turn) = 下一个实际走棋方（game.turn 此时尚未翻转）
  updateScoreDisplay(game.turn === BLACK, enemy(game.turn));

  game.chosenLayers = null;

  if (kingCaptured) {
    game.gameOver = true;
    game.isDraw   = (kingCaptured === 'draw');
    game.winner   = game.isDraw ? null : enemy(kingCaptured);
    game.endMessage = game.isDraw
      ? '🤝 对局结束：双方王同时被吃掉，和棋。'
      : `🎉 对局结束：${game.winner === RED ? '红' : '黑'}方吃掉${kingCaptured === RED ? '红' : '黑'}方王，已经获胜。`;
    addLog(game.isDraw ? '【双王同归于尽！和棋】'
           : `【${kingCaptured === RED ? '红' : '黑'}方王被吃掉，${game.winner === RED ? '红' : '黑'}方获胜！】`, true);
    updateUI(); updateCapturedDisplay(); render();
    _reportGameEnd();
    return;
  }

  game.turn = enemy(game.turn);

  game.kingDanger = assessKingDanger(game.board, game.turn);
  updateUI(); updateCapturedDisplay(); render();

  // 局内星星进度实时上报
  if (_LEVEL_ID) {
    try { window.parent.postMessage({
      type: 'game-progress',
      stats: { ...gameStats },
      redPct: lastRedPct,
      advantage: lastAdvantage,
      capturedRed: game.captured.filter(c => c.owner === RED).map(c => CHARS[RED][c.type]),
      capturedBlack: game.captured.filter(c => c.owner === BLACK).map(c => CHARS[BLACK][c.type]),
      moves: moveLogSimple.slice(-12),
    }, '*'); } catch(e) {}
  }

  // AI 自动走棋
  if (!game.gameOver && aiState.enabled && game.turn === aiState.side) {
    setTimeout(triggerAI, 300);
  }
}

function undoMove() {
  if (anim.playing || !game.history.length) return;
  abortAIThinking();
  const prev = game.history.pop();
  logUndo();
  restoreHistorySnapshot(prev);
  game.phase = 'select';
  game.selected = null;
  game.chosenLayers = null;
  game.hoverIdx = null;
  game.specialMode = false;
  game.legalMoves = [];
  game.gameOver = false;
  game.winner = null;
  game.isDraw = false;
  game.endMessage = '';
  game.hoveredMoveIdx = null;
  game.kingDanger = assessKingDanger(game.board, game.turn);
  clearPieceHint();
  updateUI(); updateCapturedDisplay(); render();
  updateScoreDisplay(false);
  if (_LEVEL_ID) {
    try { window.parent.postMessage({
      type: 'game-progress',
      stats: { ...gameStats },
      redPct: lastRedPct,
      advantage: lastAdvantage,
      capturedRed: game.captured.filter(c => c.owner === RED).map(c => CHARS[RED][c.type]),
      capturedBlack: game.captured.filter(c => c.owner === BLACK).map(c => CHARS[BLACK][c.type]),
      moves: moveLogSimple.slice(-12),
    }, '*'); } catch(e) {}
  }
}

function undoCommand() {
  if (anim.playing || !game.history.length) return;
  const lastSnapshot = game.history[game.history.length - 1];
  const lastMover = lastSnapshot?.turn;
  const steps = aiState.enabled && lastMover === aiState.side && game.history.length >= 2 ? 2 : 1;
  for (let i = 0; i < steps; i++) {
    if (!game.history.length) break;
    undoMove();
  }
  scheduleAIIfNeeded(300);
}

function restartGame() {
  if (anim.playing) return;
  aiState.searchToken += 1;
  if (aiState.ponderTimer) { clearTimeout(aiState.ponderTimer); aiState.ponderTimer = null; }
  if (typeof AI !== 'undefined') AI.abortPonder();
  aiState.pondering = false;
  game.board = initBoard();
  game.turn = RED;
  game.phase = 'select';
  game.selected = null;
  game.chosenLayers = null;
  game.hoverIdx = null;
  game.specialMode = false;
  game.legalMoves = [];
  game.history = [];
  game.gameOver = false;
  game.winner = null;
  game.isDraw = false;
  game.endMessage = '';
  game.kingDanger = 'safe';
  game.captured = [];
  game.lastMove = null;
  game.hoveredMoveIdx = null;
  // 重置对局统计
  gameStats.typesMoved    = [];
  gameStats.typesCaptured = [];
  gameStats.redKillsByType = { K:0, R:0, C:0, H:0, B:0, A:0, P:0 };
  gameStats.redSurvivalByType = createSurvivalMap();
  gameStats.redSurvivalFinalized = false;
  gameStats.totalMoves    = 0;
  gameStats.kingLeftPalace = false;
  gameStats.kingKillsStacked = 0;
  gameStats.maxChainKills = 0;
  gameStats.pawnExplodeKills = 0;
  gameStats.rookTransportedStackedPawn = false;
  gameStats.stackedPawnReachedBottom   = false;
  gameStats.complete = false;
  gameStats.outcome = null;
  gameStats.win = false;
  gameStats.playerSide = null;
  gameStats.aiSide = null;
  resetRedSurvivalStats();
  moveLogSimple = [];
  logReset();
  aiState.thinking = false;
  AI.clearTT();
  updateUI(); updateCapturedDisplay(); updateAIUI(); render();
  updateScoreDisplay(false);
  // 重置局内进度
  if (_LEVEL_ID) {
    try { window.parent.postMessage({
      type: 'game-progress',
      stats: { ...gameStats },
      redPct: lastRedPct,
      advantage: lastAdvantage,
      capturedRed: [],
      capturedBlack: [],
      moves: [],
    }, '*'); } catch(e) {}
  }
}

// ─────────────────────────────────────────────
//  渲染
// ─────────────────────────────────────────────
const canvas = document.getElementById('board-canvas');
const ctx = canvas.getContext('2d');
canvas.width  = W;
canvas.height = H;

// CSS 缩放时将显示坐标转换为 canvas 坐标
function canvasXY(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width;
  const sy = canvas.height / rect.height;
  return { px: (e.clientX - rect.left) * sx, py: (e.clientY - rect.top) * sy };
}

const cx = col => PAD + (isBoardFlipped() ? COLS - 1 - col : col) * CELL;
const cy = row => PAD + (isBoardFlipped() ? ROWS - 1 - row : row) * CELL;
const boardX = px => Math.round((px - PAD) / CELL);
const boardY = py => Math.round((py - PAD) / CELL);
function pointToBoard(px, py) {
  const viewCol = boardX(px);
  const viewRow = boardY(py);
  return {
    col: isBoardFlipped() ? COLS - 1 - viewCol : viewCol,
    row: isBoardFlipped() ? ROWS - 1 - viewRow : viewRow,
  };
}

function boardCellRect(col1, row1, col2, row2) {
  const x1 = cx(col1);
  const x2 = cx(col2);
  const y1 = cy(row1);
  const y2 = cy(row2);
  return {
    x: Math.min(x1, x2) - CELL / 2,
    y: Math.min(y1, y2) - CELL / 2,
    w: Math.abs(x2 - x1) + CELL,
    h: Math.abs(y2 - y1) + CELL,
  };
}

const CHARS = {
  [RED]:   { K:'帅', A:'仕', B:'相', H:'马', R:'车', C:'炮', P:'兵' },
  [BLACK]: { K:'将', A:'士', B:'象', H:'馬', R:'車', C:'砲', P:'卒' },
};
const FG   = { [RED]:'#c0392b', [BLACK]:'#111' };
const BG   = { [RED]:'#fce8c8', [BLACK]:'#d5d0c0' };
const BORD = { [RED]:'#8b1a0a', [BLACK]:'#444' };

function render() {
  ctx.clearRect(0, 0, W, H);

  // 棋盘底色
  const boardGradient = ctx.createLinearGradient(0, 0, 0, H);
  boardGradient.addColorStop(0, '#d8b979');
  boardGradient.addColorStop(0.52, '#cfa764');
  boardGradient.addColorStop(1, '#bc8d4b');
  ctx.fillStyle = boardGradient;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.strokeStyle = 'rgba(91, 58, 25, 0.5)';
  ctx.lineWidth = 10;
  ctx.strokeRect(PAD - 24, PAD - 24, CELL * (COLS - 1) + 48, CELL * (ROWS - 1) + 48);
  ctx.strokeStyle = 'rgba(255, 231, 166, 0.22)';
  ctx.lineWidth = 2;
  ctx.strokeRect(PAD - 17, PAD - 17, CELL * (COLS - 1) + 34, CELL * (ROWS - 1) + 34);
  ctx.restore();

  // 网格
  ctx.strokeStyle = '#7a5c2e';
  ctx.lineWidth = 1;
  for (let c = 0; c < COLS; c++) {
    if (c === 0 || c === COLS-1) {
      line(cx(c), cy(0), cx(c), cy(9));
    } else {
      line(cx(c), cy(0), cx(c), cy(4));
      line(cx(c), cy(5), cx(c), cy(9));
    }
  }
  for (let r = 0; r < ROWS; r++) line(cx(0), cy(r), cx(8), cy(r));

  // 河界文字 + 标题
  ctx.fillStyle = '#7a5c2e';
  ctx.font = 'bold 15px "Microsoft YaHei",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('楚  河', cx(1.5), cy(4.5));
  ctx.fillText('汉  界', cx(6.5), cy(4.5));
  // 科王象棋标题居中显示在楚河汉界中间
  ctx.fillStyle = '#6b3a10';
  ctx.font = 'bold 20px "Microsoft YaHei",serif';
  ctx.fillText('科  王  象  棋', cx(4), cy(4.5));

  // 九宫斜线
  palaceLines(3,0,5,2);
  palaceLines(3,7,5,9);

  // 兵炮标记
  for (const [c,r] of [
    [1,2],[7,2],[1,7],[7,7],
    [0,3],[2,3],[4,3],[6,3],[8,3],
    [0,6],[2,6],[4,6],[6,6],[8,6],
  ]) corner(cx(c), cy(r), 5);

  // 棋盘坐标
  ctx.fillStyle = '#7a5c2e99';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const colLabels = ['一','二','三','四','五','六','七','八','九'];
  for (let c = 0; c < COLS; c++) {
    ctx.fillText(colLabels[c], cx(c), cy(9) + 30);   // 下方列号
    ctx.fillText(String(9-c), cx(c), cy(0) - 30);    // 上方列号（黑方视角）
  }
  ctx.textAlign = 'right';
  for (let r = 0; r < ROWS; r++) {
    ctx.fillText(String(ROWS-r), cx(0) - 30, cy(r)); // 左侧行号
  }

  // 最后一步标记
  if (game.lastMove && !anim.playing) {
    drawLastMoveUnderlay(game.lastMove);
  }

  // 走点高亮（三色 + 叠层蓝色区分）
  for (const m of game.legalMoves) {
    // 叠层特殊标记（蓝色双环）
    if (m.kind === 'stack') {
      ctx.beginPath();
      ctx.arc(cx(m.col), cy(m.row), R+4, 0, Math.PI*2);
      ctx.strokeStyle = '#3498db';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx(m.col), cy(m.row), R+8, 0, Math.PI*2);
      ctx.strokeStyle = '#3498db88';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      continue;
    }

    const dc = m.danger === 'fatal' ? '#e74c3c'   // 红
             : m.danger === 'hurt'  ? '#f1c40f'   // 黄
             : '#27ae60';                          // 绿

    if (m.kind === 'charge') {
      // 冲撞目标：虚线圆圈 + 危险色
      ctx.beginPath();
      ctx.arc(cx(m.col), cy(m.row), R+4, 0, Math.PI*2);
      ctx.strokeStyle = dc;
      ctx.lineWidth = 3;
      ctx.setLineDash([5,3]);
      ctx.stroke();
      ctx.setLineDash([]);
      continue;
    }
    const tgt = game.board[m.row][m.col];
    if (tgt) {
      // 有棋子：圆圈（吃子 / 叠层）
      ctx.beginPath();
      ctx.arc(cx(m.col), cy(m.row), R+4, 0, Math.PI*2);
      ctx.strokeStyle = dc;
      ctx.lineWidth = 3;
      ctx.stroke();
    } else {
      // 空格：实心点
      ctx.beginPath();
      ctx.arc(cx(m.col), cy(m.row), 9, 0, Math.PI*2);
      ctx.fillStyle = dc + 'cc';
      ctx.fill();
    }
  }

  // 预览红框（仅悬停走法显示）
  if (game.hoveredMoveIdx != null && game.legalMoves[game.hoveredMoveIdx]) {
    const hm = game.legalMoves[game.hoveredMoveIdx];
    if (hm.preview) {
      for (const p of hm.preview) {
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(cx(p.col)-CELL/2+2, cy(p.row)-CELL/2+2, CELL-4, CELL-4);
        ctx.fillStyle = '#e74c3c18';
        ctx.fillRect(cx(p.col)-CELL/2+2, cy(p.row)-CELL/2+2, CELL-4, CELL-4);
      }
    }
  }

  // 兵自爆预览（pickLayer阶段，棋子为兵时显示爆炸范围）
  if (game.phase === 'pickLayer' && game.selected) {
    const sp = game.board[game.selected.row][game.selected.col];
    if (sp?.type === TYPE.PAWN) {
      const zone = computeExplosionZone(game.board, game.selected.col, game.selected.row, sp.layer); // 范围=总层数
      for (const p of zone) {
        ctx.strokeStyle = '#e74c3c88';
        ctx.lineWidth = 2;
        ctx.strokeRect(cx(p.col)-CELL/2+3, cy(p.row)-CELL/2+3, CELL-6, CELL-6);
      }
    }
  }

  // 王的危险高亮
  if (game.kingDanger !== 'safe' && !game.gameOver) {
    const warnColor = game.kingDanger === 'fatal' ? '#e74c3c' : '#f1c40f';
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        const p = game.board[r][c];
        if (p?.type === TYPE.KING && p.owner === game.turn) {
          ctx.beginPath();
          ctx.arc(cx(c), cy(r), R+6, 0, Math.PI*2);
          ctx.strokeStyle = warnColor;
          ctx.lineWidth = 4;
          ctx.stroke();
        }
      }
  }

  // 动画红框覆盖（爆炸/波/冲撞动画中）
  for (const o of anim.overlays) {
    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 3;
    ctx.strokeRect(cx(o.col)-CELL/2+1, cy(o.row)-CELL/2+1, CELL-2, CELL-2);
    ctx.fillStyle = '#e74c3c22';
    ctx.fillRect(cx(o.col)-CELL/2+1, cy(o.row)-CELL/2+1, CELL-2, CELL-2);
  }

  // 棋子（动画时跳过滑动中的源位置）
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (anim.srcHide && anim.srcHide.col === c && anim.srcHide.row === r) continue;
      const p = game.board[r][c];
      if (!p) continue;
      const sel = game.selected?.col === c && game.selected?.row === r;
      drawPiece(c, r, p, sel);
    }
  }

  // 动画：滑动棋子
  if (anim.slide) drawPieceAt(anim.slide.x, anim.slide.y, anim.slide.piece, false);

  // 最后一步角标覆盖在棋子外缘，不遮盖棋面文字。
  if (game.lastMove && !anim.playing) {
    drawLastMoveOverlay(game.lastMove);
  }

  // 动画：马路径线
  if (anim.pathLines.length) {
    ctx.save();
    ctx.strokeStyle = '#27ae60cc';
    ctx.lineWidth = 3;
    ctx.setLineDash([6,3]);
    for (const ln of anim.pathLines) {
      ctx.beginPath();
      ctx.moveTo(cx(ln.fromCol), cy(ln.fromRow));
      ctx.lineTo(cx(ln.toCol), cy(ln.toRow));
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.restore();
  }

  // 动画：光环
  if (anim.glow) {
    const a = Math.round(anim.glow.alpha*255).toString(16).padStart(2,'0');
    ctx.beginPath();
    ctx.arc(cx(anim.glow.col), cy(anim.glow.row), anim.glow.radius, 0, Math.PI*2);
    ctx.strokeStyle = anim.glow.color + a;
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  // 动画：九宫出宫绿框
  if (anim.palaceGlow) {
    const a = Math.round(anim.palaceGlow.alpha*255).toString(16).padStart(2,'0');
    const topRow = anim.palaceGlow.owner === RED ? 7 : 0;
    ctx.strokeStyle = '#27ae60' + a;
    ctx.lineWidth = 4;
    const rect = boardCellRect(3, topRow, 5, topRow + 2);
    ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
  }

  // 选层/自爆环（仅双击流程显示）
  // pickLayer：正在选层（高亮 hover 扇区）
  // pickTarget + specialMode：已选层等待落子（高亮已确认扇区，提示玩家）
  if (game.selected && (game.phase === 'pickLayer' ||
      (game.phase === 'pickTarget' && game.specialMode))) {
    const { col, row } = game.selected;
    const piece = game.board[row][col];
    if (piece) {
      const sectors = getPieceSectors(piece);
      if (sectors.length > 0) {
        let highlightIdx = null;
        if (game.phase === 'pickLayer') {
          highlightIdx = game.hoverIdx;
        } else {
          // pickTarget+specialMode：找已选 chosenLayers 对应的扇区下标
          highlightIdx = sectors.findIndex(s => s.value === game.chosenLayers);
          if (highlightIdx < 0) highlightIdx = null;
        }
        const picker = layerPickerCenter(col, row);
        drawLayerPicker(picker.x, picker.y, sectors, highlightIdx);
      }
    }
  }
}

// ─────────────────────────────────────────────
//  选层/自爆弧形选择器（双击弹出）
//  扇区设计：
//    · 普通多层棋子：[拆1, 拆2, …, 拆N-1]          共 N-1 扇区
//    · 多层兵      ：[拆1, 拆2, …, 拆N-1, 爆]       共 N 扇区
//    · 1 层兵      ：[爆]                           共 1 扇区
//    · 1 层非王非兵：无扇区，双击不弹出
//  "全部 N 层移动"由单击完成，不放入环中
// ─────────────────────────────────────────────
const PICK_R_IN  = R + 8;   // = 35，棋子高亮圈(R+6)外侧
const PICK_R_OUT = R + 36;  // = 63，环宽 28px

function clampNumber(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function layerPickerCenter(col, row) {
  const margin = PICK_R_OUT + 8;
  return {
    x: clampNumber(cx(col), margin, W - margin),
    y: clampNumber(cy(row), margin, H - margin),
  };
}

// 生成棋子双击环的扇区数组：{ label, value }
// value = 层数(number) 表示拆分（最多N-1层，第N层=单击），value = 'explode' 表示自爆
// 双击有意义的情况：叠子（可拆分）或兵（可自爆）
function getPieceSectors(piece) {
  const sectors = [];
  if (_CLASSIC || !piece || piece.upgraded === false) return sectors;
  // 合体选项：存在多个组时显示
  if (canMergePiece(piece)) {
    sectors.push({ label: '合', value: 'merge' });
  }
  // 拆分选项：已合体（单组）且层数 > 1
  if (canSplitPiece(piece)) {
    for (let k = 1; k < piece.layer; k++) {
      sectors.push({ label: `拆${k}`, value: k });
    }
  }
  if (piece.type === TYPE.PAWN) {
    sectors.push({ label: '爆', value: 'explode' });
  }
  return sectors;
}

// 绘制选层环：sectors 数组，hoveredIdx 为 0-based 高亮扇区下标（null=无）
function drawLayerPicker(x, y, sectors, hoveredIdx) {
  const n = sectors.length;
  if (n === 0) return;
  const sweep = (Math.PI * 2) / n;
  const startAngle = -Math.PI / 2;

  for (let i = 0; i < n; i++) {
    const { label, value } = sectors[i];
    const isExplode = value === 'explode';
    const gap = Math.min(0.06, sweep * 0.15);
    const a0 = startAngle + sweep * i + gap;
    const a1 = startAngle + sweep * (i + 1) - gap;
    const aMid = startAngle + sweep * (i + 0.5);
    const isHovered = hoveredIdx === i;

    // 环形扇区（外弧→内弧逆时针→闭合，圆心透明不遮棋子）
    ctx.beginPath();
    ctx.arc(x, y, PICK_R_OUT, a0, a1);
    ctx.arc(x, y, PICK_R_IN,  a1, a0, true);
    ctx.closePath();

    const isMerge = value === 'merge';
    // 自爆=红色，合体=绿色，拆分=蓝色
    ctx.fillStyle = isExplode
      ? (isHovered ? '#e74c3cf0' : '#e74c3cb0')
      : isMerge
        ? (isHovered ? '#27ae60f0' : '#27ae60b0')
        : (isHovered ? '#2980b9f0' : '#2980b9b0');
    ctx.fill();
    ctx.strokeStyle = '#fffc';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 标签（数字或"爆"）
    const txDist = (PICK_R_IN + PICK_R_OUT) / 2;
    const tx = x + Math.cos(aMid) * txDist;
    const ty = y + Math.sin(aMid) * txDist;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${n <= 4 ? 13 : 11}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, tx, ty);
  }
}

// 命中测试：返回 0-based 扇区下标，或 null（未命中环形）
function hitLayerPicker(px, py, ox, oy, sectorCount) {
  if (sectorCount === 0) return null;
  const dx = px - ox, dy = py - oy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < PICK_R_IN || dist > PICK_R_OUT) return null;
  let angle = Math.atan2(dy, dx) - (-Math.PI / 2);
  if (angle < 0) angle += Math.PI * 2;
  const sweep = (Math.PI * 2) / sectorCount;
  const idx = Math.floor(angle / sweep);
  return idx < sectorCount ? idx : sectorCount - 1;
}

function line(x1,y1,x2,y2) {
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function palaceLines(c1,r1,c2,r2) {
  ctx.strokeStyle='#7a5c2e'; ctx.lineWidth=1;
  line(cx(c1),cy(r1),cx(c2),cy(r2));
  line(cx(c2),cy(r1),cx(c1),cy(r2));
}
function corner(x,y,s) {
  ctx.strokeStyle='#7a5c2e'; ctx.lineWidth=1;
  for (const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
    ctx.beginPath();
    ctx.moveTo(x+sx*3,y+sy*s); ctx.lineTo(x+sx*s,y+sy*s); ctx.lineTo(x+sx*s,y+sy*3);
    ctx.stroke();
  }
}

function drawLastMoveUnderlay(move) {
  const cells = [
    [move.fromCol, move.fromRow],
    [move.toCol, move.toRow],
  ];
  for (const [mc, mr] of cells) {
    ctx.fillStyle = '#ffd8612d';
    ctx.fillRect(cx(mc) - CELL / 2 + 2, cy(mr) - CELL / 2 + 2, CELL - 4, CELL - 4);
  }
}

function drawLastMoveOverlay(move) {
  drawLastMoveCorners(move.fromCol, move.fromRow, '#9a6a18', 2);
  drawLastMoveCorners(move.toCol, move.toRow, '#c6281d', 3);
}

function drawLastMoveCorners(col, row, color, width) {
  const x = cx(col);
  const y = cy(row);
  const outer = CELL / 2 - 5;
  const len = 13;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = width + 3;
  ctx.strokeStyle = '#fff4b8';
  drawCornerStrokes(x, y, outer, len);
  ctx.lineWidth = width;
  ctx.strokeStyle = color;
  drawCornerStrokes(x, y, outer, len);
  ctx.restore();
}

function drawCornerStrokes(x, y, outer, len) {
  const signs = [
    [-1, -1],
    [1, -1],
    [-1, 1],
    [1, 1],
  ];
  for (const [sx, sy] of signs) {
    ctx.beginPath();
    ctx.moveTo(x + sx * outer, y + sy * (outer - len));
    ctx.lineTo(x + sx * outer, y + sy * outer);
    ctx.lineTo(x + sx * (outer - len), y + sy * outer);
    ctx.stroke();
  }
}

// 在任意坐标绘制棋子（动画滑动用）
function drawPieceAt(x, y, piece, selected) {
  if (selected) {
    ctx.beginPath();
    ctx.arc(x, y, R+6, 0, Math.PI*2);
    ctx.fillStyle = '#f1c40f55';
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(x, y + 2, R, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(63, 38, 16, 0.22)';
  ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2);
  ctx.fillStyle = BG[piece.owner]; ctx.fill();
  ctx.strokeStyle = selected ? '#f1c40f' : BORD[piece.owner];
  ctx.lineWidth = selected ? 3 : 2; ctx.stroke();
  ctx.fillStyle = FG[piece.owner];
  ctx.font = 'bold 19px "Microsoft YaHei",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(CHARS[piece.owner][piece.type], x, y);
  if (!_CLASSIC && piece.upgraded !== false) {
    const sx = x - R + 8;
    const sy = y - R + 8;
    ctx.beginPath();
    ctx.arc(sx, sy, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#f6c84c';
    ctx.fill();
    ctx.strokeStyle = '#8b4a12';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#7a2b13';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('★', sx, sy + 0.5);
  }
  if (piece.layer > 1) {
    if (piece.groups && piece.groups.length > 1) {
      // 未合体：同样的红圆样式，在右侧上下等分点显示各组层数
      const n = piece.groups.length;
      const lx = x + R - 8;
      const baseColor = piece.type === TYPE.KING ? '#8e44ad' : '#e74c3c';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let i = 0; i < n; i++) {
        const ly = y - (R - 8) + i * 2 * (R - 8) / (n - 1);
        ctx.beginPath(); ctx.arc(lx, ly, 9, 0, Math.PI * 2);
        ctx.fillStyle = baseColor; ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif';
        ctx.fillText(piece.groups[i], lx, ly);
      }
    } else {
      // 已合体：右下角红圆显示总层数
      const lx = x+R-8, ly = y+R-8;
      ctx.beginPath(); ctx.arc(lx, ly, 9, 0, Math.PI*2);
      ctx.fillStyle = piece.type===TYPE.KING ? '#8e44ad' : '#e74c3c'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(piece.layer, lx, ly);
    }
  }
}

function drawPiece(col, row, piece, selected) {
  drawPieceAt(cx(col), cy(row), piece, selected);
}

// ─────────────────────────────────────────────
//  UI
// ─────────────────────────────────────────────
function updateUI() {
  const ti = document.getElementById('turn-indicator');
  const mg = document.getElementById('message');
  if (game.gameOver) {
    if (game.isDraw) {
      ti.textContent = '和棋结束';
      ti.className = 'draw';
      mg.textContent = game.endMessage || '🤝 对局结束：双方和棋。';
    } else {
      ti.textContent = `${game.winner === RED ? '红' : '黑'}方获胜`;
      ti.className = game.winner === RED ? 'red' : 'black';
      mg.textContent = game.endMessage || `🎉 对局结束：${game.winner === RED ? '红' : '黑'}方吃掉对方王，已经获胜。`;
    }
    postGameStatus();
    return;
  }
  ti.textContent = `${game.turn === RED ? '红' : '黑'}方回合`;
  ti.className = game.turn;
  mg.textContent = game.kingDanger === 'fatal' ? '⚠️ 将军！王面临致命威胁'
                 : game.kingDanger === 'hurt'  ? '⚠️ 王面临非致命伤害'
                 : '';
  postGameStatus();
}

const _TYPE_CN = { K:'王', R:'车', C:'炮', H:'马', B:'象', A:'士', P:'兵' };

// ── 胜率历史 & 日志状态 ──
const wrHistory = [0.5];   // 每步结束后红方胜率
let logMoveNum = 0;

function cnText(t) {
  return t.replace(/\b([KRCHBAP])\b/g, c => _TYPE_CN[c] || c)
          .replace(/([KRCHBAP])(?=[\(（])/g, c => _TYPE_CN[c] || c)
          .replace(/→(\d+),(\d+)/g, (_, c, r) => `→${+c+1}列${+r+1}行`)
          .replace(/至(\d+),(\d+)/g, (_, c, r) => `至${+c+1}列${+r+1}行`);
}

function addLog(text, isSystem) {
  if (!text) return;
  const el = document.getElementById('log-moves');
  if (!el) return;
  const display = cnText(text);

  if (isSystem) {
    const item = document.createElement('div');
    item.className = 'log-item sys-msg';
    item.dataset.type = 'sys';
    item.textContent = display;
    el.prepend(item);
    return;
  }

  logMoveNum++;
  const side = game.turn;  // 走棋方（move尚未换手）
  const isRed = side === RED;

  const item = document.createElement('div');
  item.className = `log-item ${isRed ? 'red-move' : 'blk-move'}`;
  item.dataset.n = logMoveNum;

  const events = display.split(' | ').map(e => e.trim()).filter(Boolean);
  const evHtml = events.map(e => `<span class="log-event">${e}</span>`).join('');

  item.innerHTML =
    `<div class="log-move-head">
       <span class="log-num">#${logMoveNum}</span>
       <span class="log-side ${isRed ? 'red' : 'blk'}">${isRed ? '●红方' : '○黑方'}</span>
     </div>
     <div class="log-move-body">${evHtml}</div>`;

  el.prepend(item);

  const cntEl = document.getElementById('log-move-count');
  if (cntEl) cntEl.textContent = logMoveNum + ' 步';
}

function logUndo() {
  const el = document.getElementById('log-moves');
  if (!el) return;
  // 移除最新一步棋。终局系统消息也 prepend 在顶部，需要先清掉。
  while (el.firstElementChild && !el.firstElementChild.dataset.n) {
    el.removeChild(el.firstElementChild);
  }
  const node = el.firstElementChild;
  if (node) {
    el.removeChild(node);
    const cntEl = document.getElementById('log-move-count');
    if (cntEl) cntEl.textContent = logMoveNum + ' 步';
  }
}

function logReset() {
  const el = document.getElementById('log-moves');
  if (el) el.innerHTML = '';
  wrHistory.length = 0;
  wrHistory.push(0.5);
  logMoveNum = 0;
  const cntEl = document.getElementById('log-move-count');
  if (cntEl) cntEl.textContent = '0 步';
}

// ── 胜率计算与图表 ──
const WR_K = 600;  // sigmoid 缩放系数（越大曲线越平缓）
function scoreToWR(s) { return 1 / (1 + Math.exp(-s / WR_K)); }

function advantageText(score) {
  const a = Math.abs(score);
  const side = score > 0 ? '红方' : '黑方';
  if (a < 60)   return '均势';
  if (a < 400)  return side + '微优';
  if (a < 1500) return side + '优势';
  if (a < 6000) return side + '大优';
  return side + '必胜';
}

function updateScoreDisplay(push, nextMover) {
  // 胜率条固定为红方视角，但必须看下一方最佳走法和对手最佳应对。
  // 不能只看静态分，否则会漏掉一手战术；也不能只看下一方一步，否则会把单方先手权误当长期优势。
  const rawScore = AI.displayEval(game.board, nextMover || game.turn);
  const wr = scoreToWR(rawScore);
  const lastWr = wrHistory.length ? wrHistory[wrHistory.length - 1] : wr;
  const terminalLike = Math.abs(rawScore) >= 90000;
  const smoothWr = terminalLike ? wr : (push === false ? (lastWr * 0.82 + wr * 0.18) : (lastWr * 0.68 + wr * 0.32));
  if (push !== false) wrHistory.push(wr);

  const redPct = Math.round(smoothWr * 100);
  const blkPct = 100 - redPct;
  const redEl = document.getElementById('red-wr-pct');
  const blkEl = document.getElementById('blk-wr-pct');
  const fillRed = document.getElementById('score-fill-red');
  const fillBlk = document.getElementById('score-fill-blk');
  const advEl  = document.getElementById('score-advantage');
  if (redEl)  redEl.textContent  = redPct + '%';
  if (blkEl)  blkEl.textContent  = blkPct + '%';
  if (fillRed) fillRed.style.width = redPct + '%';
  if (fillBlk) fillBlk.style.width = blkPct + '%';
  if (advEl)  advEl.textContent  = advantageText(rawScore);

  drawWinRateChart();
  lastRedPct = redPct;
  lastAdvantage = advantageText(rawScore);
  if (_LEVEL_ID && window.self !== window.top) {
    try {
      window.parent.postMessage({
        type: 'game-progress',
        stats: { ...gameStats },
        redPct,
        advantage: lastAdvantage,
        capturedRed: game.captured.filter(c => c.owner === RED).map(c => CHARS[RED][c.type]),
        capturedBlack: game.captured.filter(c => c.owner === BLACK).map(c => CHARS[BLACK][c.type]),
        moves: moveLogSimple.slice(-12),
      }, '*');
    } catch(e) {}
  }
}

function drawWinRateChart() {
  const canvas = document.getElementById('winrate-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;
  ctx.clearRect(0, 0, CW, CH);

  // 背景
  ctx.fillStyle = '#0d0d22';
  ctx.fillRect(0, 0, CW, CH);

  // 50% 基准线
  ctx.strokeStyle = '#2a2a4a';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(0, CH/2); ctx.lineTo(CW, CH/2); ctx.stroke();
  ctx.setLineDash([]);

  // 红/黑标记
  ctx.fillStyle = '#c0392b44'; ctx.fillRect(0, 0, CW, CH/2);
  ctx.fillStyle = '#3d7a9a44'; ctx.fillRect(0, CH/2, CW, CH/2);

  if (wrHistory.length < 2) return;

  const n = wrHistory.length;
  const stepX = CW / Math.max(n - 1, 1);
  const px = i => i * stepX;
  const py = w => CH * (1 - w);

  // 填充区域
  ctx.beginPath();
  ctx.moveTo(px(0), py(wrHistory[0]));
  for (let i = 1; i < n; i++) ctx.lineTo(px(i), py(wrHistory[i]));
  ctx.lineTo(px(n-1), CH/2);
  ctx.lineTo(px(0), CH/2);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, 0, CH);
  grad.addColorStop(0,   '#e74c3c66');
  grad.addColorStop(0.5, '#e74c3c11');
  ctx.fillStyle = grad; ctx.fill();

  // 折线
  ctx.beginPath();
  ctx.moveTo(px(0), py(wrHistory[0]));
  for (let i = 1; i < n; i++) ctx.lineTo(px(i), py(wrHistory[i]));
  ctx.strokeStyle = '#f0c060';
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // 最新点
  const lx = px(n-1), ly = py(wrHistory[n-1]);
  ctx.beginPath(); ctx.arc(lx, ly, 3, 0, Math.PI*2);
  ctx.fillStyle = '#f0c060'; ctx.fill();
}

// 鼠标移动：悬停检测 + 光标样式
canvas.addEventListener('mousemove', e => {
  if (anim.playing) return;
  if (isAITurn()) {
    canvas.style.cursor = 'default';
    return;
  }
  const { px, py } = canvasXY(e);

  // 计算鼠标对应的棋盘格
  const { col: hCol, row: hRow } = pointToBoard(px, py);
  const onGrid = inBoard(hCol, hRow) && Math.sqrt((px-cx(hCol))**2+(py-cy(hRow))**2) <= CELL*0.55;

  // pickLayer阶段：扇区悬停
  if (game.phase === 'pickLayer' && game.selected) {
    const { col, row } = game.selected;
    const piece = game.board[row][col];
    if (piece) {
      const sectors = getPieceSectors(piece);
        const picker = layerPickerCenter(col, row);
        const hit = hitLayerPicker(px, py, picker.x, picker.y, sectors.length);
      if (hit !== game.hoverIdx) { game.hoverIdx = hit; render(); }
      canvas.style.cursor = hit !== null ? 'pointer' : 'default';
    }
    return;
  }

  // pickTarget阶段：走法悬停 + 预览
  if (game.phase === 'pickTarget' && game.selected) {
    let newIdx = null;
    if (onGrid) {
      const idx = game.legalMoves.findIndex(m => m.col === hCol && m.row === hRow);
      if (idx >= 0) newIdx = idx;
    }
    if (newIdx !== game.hoveredMoveIdx) { game.hoveredMoveIdx = newIdx; render(); }
    // 光标：走法目标 或 己方棋子（可切选）
    if (newIdx !== null) { canvas.style.cursor = 'pointer'; return; }
    if (onGrid) {
      const p = game.board[hRow][hCol];
      if (p && p.owner === game.turn) { canvas.style.cursor = 'pointer'; return; }
    }
    canvas.style.cursor = 'default';
    return;
  }

  // select阶段：己方棋子悬停
  if (game.phase === 'select') {
    if (onGrid) {
      const p = game.board[hRow][hCol];
      canvas.style.cursor = (p && p.owner === game.turn) ? 'pointer' : 'default';
    } else {
      canvas.style.cursor = 'default';
    }
  }
});

canvas.addEventListener('click', e => {
  if (anim.playing || game.gameOver) return;
  if (isAITurn()) return;
  const { px, py } = canvasXY(e);

  // ── 阶段1：选层/自爆环 ──
  if (game.phase === 'pickLayer' && game.selected) {
    const { col, row } = game.selected;
    const piece = game.board[row][col];
    if (piece) {
      const sectors = getPieceSectors(piece);
        const picker = layerPickerCenter(col, row);
        const hit = hitLayerPicker(px, py, picker.x, picker.y, sectors.length);
      if (hit !== null) {
        const sector = sectors[hit];
        if (sector.value === 'explode') {
          // 自爆扇区：直接执行，不进入 pickTarget
          game.selected = { col, row };
          executeMove({ col, row, kind: 'explode', layers: piece.layer });
        } else if (sector.value === 'merge') {
          // 合体扇区：直接执行合体
          game.selected = { col, row };
          executeMove({ col, row, kind: 'merge' });
        } else {
          // 拆分扇区：确认层数，进入 pickTarget
          confirmLayer(sector.value);
        }
        return;
      }
    }
    // 点到扇区外：取消选中
    game.phase = 'select';
    game.selected = null;
    game.chosenLayers = null;
    game.hoverIdx = null;
    game.specialMode = false;
    game.legalMoves = [];
    clearPieceHint();
    render();
    return;
  }

  // ── 阶段2：选目标 ──
  if (game.phase === 'pickTarget' && game.selected) {
    // 普通格点判断
    const { col, row } = pointToBoard(px, py);
    if (inBoard(col, row)) {
      const ddx = px - cx(col), ddy = py - cy(row);
      if (Math.sqrt(ddx*ddx+ddy*ddy) <= CELL*0.55) {
        const mv = game.legalMoves.find(m => m.col === col && m.row === row);
        if (mv) {
          executeMove({ ...mv, layers: game.chosenLayers });
          return;
        }
        // 点到己方棋子 → 重新单击选（退出双击模式）
        const p = game.board[row][col];
        if (p && p.owner === game.turn) {
          selectPiece(col, row);
          return;
        }
      }
    }
    // 点到空白 → 取消
    game.phase = 'select';
    game.selected = null;
    game.chosenLayers = null;
    game.hoverIdx = null;
    game.specialMode = false;
    game.legalMoves = [];
    clearPieceHint();
    render();
    return;
  }

  // ── 阶段0：未选中，选棋子 ──
  const { col, row } = pointToBoard(px, py);
  if (!inBoard(col, row)) return;
  const ddx = px - cx(col), ddy = py - cy(row);
  if (Math.sqrt(ddx*ddx+ddy*ddy) > CELL*0.55) return;
  const p = game.board[row][col];
  if (p && p.owner === game.turn) selectPiece(col, row);
});

// ─────────────────────────────────────────────
//  双击交互：弹出拆分/自爆环
//  扇区规则（N = 棋子层数）：
//    普通多层棋子：[拆1, 拆2, …, 拆N-1]          共 N-1 扇区
//    多层兵      ：[拆1, 拆2, …, 拆N-1, 爆]       共 N 扇区
//    1 层兵      ：[爆]                           共 1 扇区
//    其他 1 层棋子：无扇区，双击无效
// ─────────────────────────────────────────────
canvas.addEventListener('dblclick', e => {
  if (_CLASSIC || anim.playing || game.gameOver) return; // 传统模式无双击特殊操作
  if (isAITurn()) return;
  const { px, py } = canvasXY(e);

  const { col, row } = pointToBoard(px, py);
  if (!inBoard(col, row)) return;
  const ddx = px - cx(col), ddy = py - cy(row);
  if (Math.sqrt(ddx*ddx + ddy*ddy) > CELL * 0.55) return;

  const p = game.board[row][col];
  if (!p || p.owner !== game.turn) return;
  if (p.type === TYPE.KING) {
    showPieceHint(p, '帅没有双击菜单，直接单击落子。');
    return;
  } // 王无双击特殊操作

  const sectors = getPieceSectors(p);
  if (sectors.length === 0) {
    showPieceHint(p, '当前没有可用的双击操作。');
    return;
  } // 无可弹出操作（1层非兵）

  // 覆盖两次单击事件留下的状态，统一进入 pickLayer 展示环
  game.selected = { col, row };
  game.specialMode = true;
  game.phase = 'pickLayer';
  game.chosenLayers = null;
  game.hoverIdx = null;
  game.legalMoves = [];
  showLayerMenuHint(p);
  render();
});
